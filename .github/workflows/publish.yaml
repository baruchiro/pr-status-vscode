name: Release

on:
  workflow_dispatch:
    inputs:
      newVersion:
        description: 'New version number'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run lint

      - name: Get VS Code versions
        run: curl --output vscode-stable-versions.json https://update.code.visualstudio.com/api/releases/stable
      - uses: actions/cache@v4
        with:
          path: .vscode-test/
          key: vscode-test-${{ hashFiles('vscode-stable-versions.json') }}
          restore-keys: vscode-test-

      - name: Run VS Code tests
        run: xvfb-run -a npm test

      - name: Update version in package.json
        run: npm version "$NEW_VERSION" --no-git-tag-version
        env:
          NEW_VERSION: ${{ inputs.newVersion }}

      - name: Publish VS Code extension
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        run: |
          gh release create "v$NEW_VERSION" \
            --title "Release v$NEW_VERSION" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.newVersion }}
